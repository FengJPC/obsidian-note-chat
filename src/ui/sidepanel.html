<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伴读侧栏</title><link rel="stylesheet" href="katex.css"><link rel="stylesheet" href="ui.css"></head><body>
<header><button id="history" class="icon" aria-label="历史对话" title="历史对话">☰</button><div class="heading"><strong>伴读侧栏</strong><span id="chatTitle">新对话</span></div><button id="newChat" class="icon" title="新对话">＋</button><button id="theme" class="icon" title="切换明暗主题">◐</button><button id="settings" class="icon" title="设置">⚙</button></header>
<div class="controls"><select id="model" aria-label="选择模型"><option value="">连接后选择模型</option></select><select id="effort" aria-label="思考强度"><option value="">模型默认</option></select><button id="openSidebar" class="subtle" hidden>在侧栏打开</button></div>
<main id="messages" aria-live="polite"></main><button id="toBottom" class="floating" hidden>↓ 最新回答</button>
<footer><div class="material-tools"><button id="readPage" class="subtle" title="读取当前笔记或 PDF，放入待发送资料">读当前笔记/PDF</button><button hidden id="capturePage" class="subtle" title="截取当前网页可见区域，放入待发送资料">截图</button><button id="upload" class="subtle">上传文件</button><input id="uploadInput" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.pdf,.txt,.md,.csv,.json,.tex,.html,.xml,.yaml,.yml,.log" hidden></div><div id="materials"></div><div id="source" hidden></div><textarea id="prompt" aria-label="输入问题" rows="2" placeholder="问点什么，也可以粘贴图片或拖入文件…"></textarea><div class="compose-row"><span id="requestStatus" role="status">Enter 发送 · Shift+Enter 换行</span><button id="undo" class="subtle" hidden>撤销删除</button><button id="stop" class="subtle" hidden>停止</button><button id="send">发送 ↑</button></div></footer>
<dialog id="settingsDialog"><div class="dialog-head"><h2>设置</h2><button data-close="settingsDialog" class="icon" aria-label="关闭设置">×</button></div><section><h3>账号</h3><p id="accountName">尚未连接</p><p id="authStatus" role="status"></p><label id="loginAccountLabel" hidden>连接已登记账号<select id="loginAccount" aria-label="连接已登记账号"></select></label><p id="registrationNote" class="note" hidden>默认复用本机已有应用登记；各库的登录和历史仍独立。</p><div class="row"><button id="login">Continue with ChatGPT</button><button id="logout" class="subtle" hidden>断开</button><button id="refreshModels" class="subtle">刷新模型</button></div><p class="note">请求使用你的套餐额度；对话保存在本机，各库历史独立，不与官网历史同步。<a href="https://chatgpt.com/#settings" target="_blank" rel="noreferrer">管理用量</a></p></section><section><h3>阅读</h3><label>界面语言<select id="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label><label>字体大小<select id="fontSize"><option value="12">12 px</option><option value="14">14 px</option><option value="15">15 px</option><option value="16">16 px</option><option value="17">17 px</option><option value="18">18 px</option><option value="20">20 px</option></select></label><label>主题<select id="themeSetting"><option value="system">跟随系统</option><option value="light">白天</option><option value="dark">夜间</option></select></label></section><section><h3>文件工具</h3><label class="check"><input id="fileTools" type="checkbox">允许 GPT 生成可下载的文本文件</label><label>单文件上限<select id="fileLimit"><option value="1">1 MB</option><option value="2">2 MB</option><option value="3">3 MB</option><option value="4">4 MB</option><option value="5">5 MB</option></select></label><p class="note">这是扩展的本地保护上限，按 UTF-8 字节计算；实际长度还受模型输出限制。支持 Markdown、TXT、CSV、JSON、HTML、TeX 等。不会执行文件内容。Word、PDF 等二进制格式暂不支持。</p></section><section><h3>当前对话</h3><button id="export" class="subtle">保存对话为 Markdown</button></section></dialog>
<dialog id="historyDialog"><div class="dialog-head"><h2>历史对话</h2><button data-close="historyDialog" class="icon" aria-label="关闭历史对话">×</button></div><input id="historySearch" placeholder="搜索标题或聊天内容…" aria-label="搜索历史对话"><div id="historyList"></div></dialog>
<script src="ui.js"></script></body></html>
